
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="86" viewBox="0 0 1200 86" role="img" aria-label="Soft lilac and pink closing accent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8DEF8"/>
      <stop offset=".52" stop-color="#F5DEEB"/>
      <stop offset="1" stop-color="#E7DDF4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="86" fill="url(#bg)"/>

  <!-- Binary details -->
  <g fill="#786589" font-family="Consolas, monospace"
     font-size="13" letter-spacing="3" opacity=".22">
    <text x="45" y="32">0110 1001</text>
    <text x="1022" y="60">1010 0110</text>
  </g>

  <!-- Circuit lines -->
