<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 26 1200 144" width="1200" height="144" role="img" aria-label="Footer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e4d6f1"/>
      <stop offset="50%" stop-color="#f6e7f1"/>
      <stop offset="100%" stop-color="#e4d6f1"/>
    </linearGradient>
    <clipPath id="oval">
      <path d="M0 170 V75 Q600 -15 1200 75 V170 Z"/>
    </clipPath>
  </defs>
  <style>
    .w1 { animation: slideL 20s linear infinite; }
    .w2 { animation: slideR 14s linear infinite; }
    .w3 { animation: slideL 10s linear infinite; }
    @keyframes slideL { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    @keyframes slideR { from { transform: translateX(-600px); } to { transform: translateX(0); } }
    .trace { fill: none; stroke: #b3a2d4; stroke-width: 1.2; opacity: .6; }
    .node  { fill: none; stroke: #b3a2d4; stroke-width: 1.2; opacity: .7; }
    .pulse { fill: none; stroke: #9a78d8; stroke-width: 2; stroke-linecap: round;
             stroke-dasharray: 18 300; animation: pulse 5s linear infinite; }
    .p2 { animation-delay: -2.5s; }
    @keyframes pulse { from { stroke-dashoffset: 318; } to { stroke-dashoffset: 0; } }
    .bin { font: 13px Consolas, 'Courier New', monospace; fill: #a596c6; letter-spacing: 2px;
           animation: blink 6s ease-in-out infinite; }
    .b2 { animation-delay: -3s; }
    @keyframes blink { 0%,100% { opacity: .3; } 50% { opacity: .75; } }
    .edge  { fill: none; stroke: #ffffff; stroke-width: 1.5; opacity: .45; }
    .glow  { fill: none; stroke: #ffffff; stroke-width: 3; stroke-linecap: round;
             stroke-dasharray: 90 1400; animation: glide 7s linear infinite reverse; }
    @keyframes glide { from { stroke-dashoffset: 1490; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#oval)">
    <rect width="1200" height="170" fill="url(#bg)"/>
    <g class="w1"><path fill="#cdbbe7" d="M0 0 V92 Q150 102 300 92 T600 92 T900 92 T1200 92 T1500 92 T1800 92 T2100 92 T2400 92 V0 Z"/></g>
    <g class="w2"><path fill="#ad93d6" d="M0 0 V66 Q150 54 300 66 T600 66 T900 66 T1200 66 T1500 66 T1800 66 T2100 66 T2400 66 V0 Z"/></g>
    <g class="w3"><path fill="#9478c6" d="M0 0 V44 Q150 54 300 44 T600 44 T900 44 T1200 44 T1500 44 T1800 44 T2100 44 T2400 44 V0 Z"/></g>

    <path class="trace" d="M60 140 H140 L156 126 H210"/>
    <path class="pulse" d="M60 140 H140 L156 126 H210"/>
    <circle class="node" cx="210" cy="126" r="3.5"/>
    <path class="trace" d="M1140 140 H1060 L1044 126 H990"/>
    <path class="pulse p2" d="M1140 140 H1060 L1044 126 H990"/>
    <circle class="node" cx="990" cy="126" r="3.5"/>

    <text class="bin" x="250" y="148">0110 0101</text>
    <text class="bin b2" x="870" y="148">1010 0110</text>
  </g>

  <path class="edge" d="M0 75 Q600 -15 1200 75"/>
  <path class="glow" d="M0 75 Q600 -15 1200 75"/>
</svg>
