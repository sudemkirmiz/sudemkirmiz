
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="80"
     viewBox="0 0 1200 80">

  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E9DEF3"/>
      <stop offset="50%" stop-color="#F4DCE8"/>
      <stop offset="100%" stop-color="#E8DCF2"/>
    </linearGradient>
  </defs>

  <!-- Wide rounded base -->
  <path d="
    M0 33
    C180 3, 360 3, 550 35
    C750 69, 950 66, 1200 24
    L1200 80 H0 Z"
    fill="url(#base)"/>

  <!-- Gentle overlapping wave -->
  <path d="
    M0 54
    C230 23, 390 48, 590 62
    C820 79, 1030 35, 1200 49
    L1200 80 H0 Z"
    fill="#BBA0D3"
    opacity="0.30"/>

  <!-- Subtle binary details -->
  <g font-family="Consolas, monospace"
     font-size="12"
     letter-spacing="3"
     fill="#7C698F"
     opacity="0.24">

    <text x="55" y="67">0110 1001</text>
    <text x="1030" y="66">1010 0110</text>

  </g>
</svg>
