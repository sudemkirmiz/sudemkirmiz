<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 234" width="1200" height="234" role="img" aria-label="Sudem Kırmız">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e4d6f1"/>
      <stop offset="50%" stop-color="#f6e7f1"/>
      <stop offset="100%" stop-color="#e4d6f1"/>
    </linearGradient>
    <clipPath id="oval">
      <path d="M0 0 H1200 V185 Q600 275 0 185 Z"/>
    </clipPath>
  </defs>
  <style>
    .w1 { animation: slideL 20s linear infinite; }
    .w2 { animation: slideR 14s linear infinite; }
    .w3 { animation: slideL 10s linear infinite; }
    @keyframes slideL { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    @keyframes slideR { from { transform: translateX(-600px); } to { transform: translateX(0); } }
    .trace { fill: none; stroke: #b3a2d4; stroke-width: 1.2; opacity: .6; }
    .node  { fill: none; stroke: #b3a2d4; stroke-width: 1.2; opacity: .7; }
    .pulse { fill: none; stroke: #9a78d8; stroke-width: 2; stroke-linecap: round;
             stroke-dasharray: 18 300; animation: pulse 5s linear infinite; }
    .p2 { animation-delay: -2.5s; }
    @keyframes pulse { from { stroke-dashoffset: 318; } to { stroke-dashoffset: 0; } }
    .bin { font: 13px Consolas, 'Courier New', monospace; fill: #a596c6; letter-spacing: 2px;
           animation: blink 6s ease-in-out infinite; }
    .b2 { animation-delay: -1.5s; } .b3 { animation-delay: -3s; } .b4 { animation-delay: -4.5s; }
    @keyframes blink { 0%,100% { opacity: .3; } 50% { opacity: .75; } }
    .edge  { fill: none; stroke: #ffffff; stroke-width: 1.5; opacity: .45; }
    .glow  { fill: none; stroke: #ffffff; stroke-width: 3; stroke-linecap: round;
             stroke-dasharray: 90 1400; animation: glide 7s linear infinite; }
    @keyframes glide { from { stroke-dashoffset: 1490; } to { stroke-dashoffset: 0; } }
    .name { font: 700 64px Georgia, 'Times New Roman', serif; fill: #2b2547; letter-spacing: 1px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#oval)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <g class="w1"><path fill="#cdbbe7" d="M0 260 V168 Q150 158 300 168 T600 168 T900 168 T1200 168 T1500 168 T1800 168 T2100 168 T2400 168 V260 Z"/></g>
    <g class="w2"><path fill="#ad93d6" d="M0 260 V194 Q150 206 300 194 T600 194 T900 194 T1200 194 T1500 194 T1800 194 T2100 194 T2400 194 V260 Z"/></g>
    <g class="w3"><path fill="#9478c6" d="M0 260 V216 Q150 206 300 216 T600 216 T900 216 T1200 216 T1500 216 T1800 216 T2100 216 T2400 216 V260 Z"/></g>

    <path class="trace" d="M190 74 H260 L276 58 H330"/>
    <path class="pulse" d="M190 74 H260 L276 58 H330"/>
    <circle class="node" cx="190" cy="74" r="3.5"/><circle class="node" cx="330" cy="58" r="3.5"/>
    <path class="trace" d="M1150 30 H1080 L1064 46 H1010"/>
    <path class="pulse p2" d="M1150 30 H1080 L1064 46 H1010"/>
    <circle class="node" cx="1010" cy="46" r="3.5"/>
    <path class="trace" d="M1150 130 H1090 L1074 116 H1030"/>
    <circle class="node" cx="1030" cy="116" r="3.5"/>

    <text class="bin" x="95" y="62">01001101</text>
    <text class="bin b2" x="130" y="150">10110100</text>
    <text class="bin b3" x="1070" y="70">11001010</text>
    <text class="bin b4" x="1040" y="152">10110101</text>
    <text class="bin b2" x="560" y="24" opacity=".4">0110</text>

    <text class="name" x="600" y="118" text-anchor="middle">Sudem Kırmız</text>
  </g>

  <path class="edge" d="M0 185 Q600 275 1200 185"/>
  <path class="glow" d="M0 185 Q600 275 1200 185"/>
</svg>
