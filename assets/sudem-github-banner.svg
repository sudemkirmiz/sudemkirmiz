
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E9D5F6"/>
      <stop offset="50%" stop-color="#F3D6E8"/>
      <stop offset="100%" stop-color="#E6C8E5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="240" fill="url(#background)"/>

  <!-- Subtle binary details -->
  <g font-family="monospace" font-size="20" fill="#675879" opacity="0.20">
    <text x="60" y="50">01001101</text>
    <text x="75" y="190">10110100</text>
    <text x="990" y="55">11001010</text>
    <text x="1010" y="195">00110101</text>
    <text x="330" y="40">0101</text>
    <text x="830" y="210">1010</text>
  </g>

  <!-- Minimal circuit details -->
  <g stroke="#80678F" stroke-width="1.5" fill="none" opacity="0.23">
    <path d="M0 115 H160 V85 H260"/>
    <circle cx="260" cy="85" r="4"/>
    <path d="M1200 125 H1040 V155 H940"/>
    <circle cx="940" cy="155" r="4"/>
    <path d="M100 240 V205 H235"/>
    <circle cx="235" cy="205" r="4"/>
    <path d="M1100 0 V35 H980"/>
    <circle cx="980" cy="35" r="4"/>
  </g>

  <!-- Main name -->
  <text x="600" y="132"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="59"
        font-weight="700"
        letter-spacing="1"
        fill="#252333">
    Sudem Kırmız
  </text>

  <!-- Bottom accent -->
  <path d="M0 230 Q300 217 600 230 T1200 227"
        fill="none" stroke="#A88DBB"
        stroke-width="2" opacity="0.32"/>
</svg>
