
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Sudem Kırmız — soft lilac engineering banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8DEF8"/>
      <stop offset="0.52" stop-color="#F5DEEB"/>
      <stop offset="1" stop-color="#E7DDF4"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#B9A5D5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#B9A5D5" stop-opacity=".7"/>
      <stop offset="1" stop-color="#B9A5D5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="210" fill="url(#bg)"/>

  <!-- Animated binary details -->
  <g fill="#786589" font-family="Consolas, 'Courier New', monospace" font-size="17" letter-spacing="3" opacity=".19">
    <g>
      <text x="75" y="46">01001101</text>
      <text x="115" y="166">10110100</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="9s" repeatCount="indefinite"/>
    </g>
    <g>
      <text x="968" y="49">11001010</text>
      <text x="975" y="164">00110101</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="11s" repeatCount="indefinite"/>
    </g>
    <g opacity=".55">
      <text x="300" y="32">01</text>
      <text x="858" y="190">10</text>
    </g>
  </g>

  <!-- Circuit pattern -->
  <g fill="none" stroke="#967FAB" stroke-width="1.5" opacity=".25">
    <path d="M0 97 H142 V76 H242"/>
    <circle cx="242" cy="76" r="3" fill="#967FAB"/>
    <path d="M1200 110 H1058 V135 H963"/>
    <circle cx="963" cy="135" r="3" fill="#967FAB"/>
    <path d="M93 210 V184 H218"/>
    <circle cx="218" cy="184" r="3" fill="#967FAB"/>
    <path d="M1100 0 V28 H995"/>
    <circle cx="995" cy="28" r="3" fill="#967FAB"/>
  </g>

  <!-- Moving circuit highlights -->
  <g fill="#8F6AB5" opacity=".5">
    <circle r="3" cx="0" cy="0">
      <animateMotion path="M0 97 H142 V76 H242" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" cx="0" cy="0">
      <animateMotion path="M1200 110 H1058 V135 H963" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Name -->
  <text x="600" y="124"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="62"
        font-weight="700"
        text-anchor="middle"
        fill="#272536"
        letter-spacing=".6">Sudem Kırmız</text>

  <path d="M0 197 Q300 189 600 197 T1200 197"
        stroke="url(#edge)" stroke-width="2" fill="none"/>
</svg>
